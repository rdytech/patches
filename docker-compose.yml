services:
  app:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION:-3.4}
    volumes:
      - .:/app
      - app-gems:/usr/local/bundle
    # Passed through from the host so a container run can reproduce a matrix
    # cell, e.g. RAILS_VERSION="~> 7.2.0" docker compose run --rm app
    environment:
      RAILS_VERSION:
      SQLITE3_VERSION:
      CONCURRENT_RUBY_VERSION:
      SIDEKIQ_VERSION:
      SIDEKIQ_STRICT_ARGS:

volumes:
  app-gems:
    driver: local
