name: Run specs
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  # Every combination the gemspec allows: Ruby 3.2+ against Rails 7.2+. The
  # floors and the matrix are the same set now, which they were not before 4.0.
  specs:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.2', rails: '~> 7.2.0' }
          - { ruby: '3.2', rails: '~> 8.0.0' }
          - { ruby: '3.2', rails: '~> 8.1.0' }
          - { ruby: '3.3', rails: '~> 7.2.0' }
          - { ruby: '3.3', rails: '~> 8.0.0' }
          - { ruby: '3.3', rails: '~> 8.1.0' }
          - { ruby: '3.4', rails: '~> 7.2.0' }
          - { ruby: '3.4', rails: '~> 8.0.0' }
          - { ruby: '3.4', rails: '~> 8.1.0' }
          - { ruby: '4.0', rails: '~> 7.2.0' }
          - { ruby: '4.0', rails: '~> 8.0.0' }
          - { ruby: '4.0', rails: '~> 8.1.0' }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec

  # Sidekiq and Slack are optional integrations, so they get their own axis
  # rather than multiplying the matrix above. Every state a consumer can be in
  # is covered: each gem absent, and Sidekiq present with strict argument
  # checking both at its default and disabled.
  optional:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Sidekiq 7 (strict args raise)', sidekiq: '~> 7.0', strict_args: 'raise' }
          - { name: 'Sidekiq 7 (strict args false)', sidekiq: '~> 7.0', strict_args: 'false' }
          - { name: 'Sidekiq 8 (strict args raise)', sidekiq: '~> 8.0', strict_args: 'raise' }
          - { name: 'Sidekiq 8 (strict args false)', sidekiq: '~> 8.0', strict_args: 'false' }
          - { name: 'Sidekiq absent', sidekiq: 'none' }
          - { name: 'slack-notifier absent', slack_notifier: 'none' }
          - { name: 'Neither installed', sidekiq: 'none', slack_notifier: 'none' }
    env:
      SIDEKIQ_VERSION: ${{ matrix.sidekiq }}
      SIDEKIQ_STRICT_ARGS: ${{ matrix.strict_args }}
      SLACK_NOTIFIER: ${{ matrix.slack_notifier }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run specs
        run: |
          # --exclude-pattern does not accumulate; the patterns go in one
          # comma-separated value.
          patterns=""
          [ "$SIDEKIQ_VERSION" = "none" ] && patterns="sidekiq/**/*_spec.rb"
          if [ "$SLACK_NOTIFIER" = "none" ]; then
            patterns="${patterns:+$patterns,}slack/**/*_spec.rb"
          fi
          if [ -n "$patterns" ]; then
            bundle exec rspec --exclude-pattern "$patterns"
          else
            bundle exec rspec
          fi

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec

      # lib/patches/version.rb is excluded from the coverage requirement, not
      # from analysis: patches.gemspec requires it, so Bundler loads it under
      # `bundle exec` before spec_helper starts SimpleCov, and its lines can
      # never be recorded as covered.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=rdytech_patches_4fe7fcf4-bbfc-4b19-be78-87e73d1f301e
            -Dsonar.host.url=https://sonarqube.readytech.io
            -Dsonar.sources=lib/
            -Dsonar.inclusions=**/*.rb
            -Dsonar.tests=spec/
            -Dsonar.ruby.coverage.reportPaths=coverage/.resultset.json
            -Dsonar.coverage.exclusions=lib/patches/version.rb
            -Dsonar.plugins.downloadOnlyRequired=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
